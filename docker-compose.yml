version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: places_api_clickhouse
    environment:
      CLICKHOUSE_DB: places_db
      CLICKHOUSE_USER: places_user
      CLICKHOUSE_PASSWORD: places_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "9000:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/init-clickhouse.sql:/docker-entrypoint-initdb.d/init-schema.sql
    healthcheck:
       test: ["CMD-SHELL", "clickhouse-client --user places_user --password places_password --database places_db --query 'SELECT 1'"]
       interval: 10s
       timeout: 5s
       retries: 5
       start_period: 30s
    #    timeout: 10s
    #    retries: 5
    #    start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: places_api_app
    depends_on:
      - clickhouse
    env_file:
      - .env
    environment:
      BROWSER_HEADLESS: true
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./notebooks:/app/notebooks
    command: python -m src.main

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: places_api_test
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BROWSER_HEADLESS: true
    volumes:
      - ./src:/app/src
      - ./test_docker.py:/app/test_docker.py
    command: python test_docker.py
    profiles:
      - test

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: places_api_jupyter
    depends_on:
      - clickhouse
    env_file:
      - .env
    environment:
      POSTGRES_HOST: clickhouse
      POSTGRES_PORT: 9000
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-places_api_token}
      JUPYTER_PASSWORD: ${JUPYTER_PASSWORD:-}
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./notebooks:/app/notebooks
      - ./docs:/app/docs
      - ./requirements.txt:/app/requirements.txt
      - ./README.md:/app/README.md
      - ./env.example:/app/env.example
    command: >
      sh -c "
        echo '🚀 Jupyter Lab starting...' &&
        echo '📊 Available at: http://localhost:'${JUPYTER_PORT:-8888} &&
        echo '🔑 Token: '${JUPYTER_TOKEN:-places_api_token} &&
        echo '📁 Working directory: /app' &&
        jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --notebook-dir=/app
        --LabApp.token=${JUPYTER_TOKEN:-places_api_token}"
    profiles:
      - jupyter

volumes:
  clickhouse_data:

